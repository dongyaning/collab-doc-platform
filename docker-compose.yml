services:
  postgres:
    image: postgres:16-alpine
    container_name: collab-doc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab_doc
    ports:
      - '5432:5432'
    volumes:
      - collab-doc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collab -d collab_doc']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collab-doc-pgdata:
